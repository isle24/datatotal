services:
  nas-traffic-lens:
    image: isle204/nas-traffic-lens:latest
    container_name: nas-traffic-lens
    restart: unless-stopped
    network_mode: host
    pid: host
    platform: linux/amd64
    privileged: true
    environment:
      # Web 服务监听端口；host 网络模式下无需配置 ports。
      APP_PORT: "8088"
      # 首次部署请修改。留空或删除该项会关闭登录验证。
      DASHBOARD_PASSWORD: "123456"
    volumes:
      # SQLite、上传图标和日志持久化。
      - ./data:/data
      - ./logs:/logs
      # 默认启用 Docker 容器发现、端口识别和容器保护。
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # 可选：极空间支持 devices 时可映射 Intel 核显或 NPU。
    # devices:
    #   - /dev/dri:/dev/dri
    #   - /dev/accel:/dev/accel
