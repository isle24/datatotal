name: Desktop preview

on:
  workflow_dispatch:
  push:
    branches: [main, 'codex/desktop-*']
    paths:
      - 'server/desktop/**'
      - 'front-end/**'
      - '.github/workflows/desktop.yml'
  pull_request:
    paths: ['server/desktop/**', 'front-end/**', '.github/workflows/desktop.yml']

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64 installer
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: front-end/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server/desktop
      - name: Install frontend dependencies
        run: npm --prefix front-end ci
      - name: Core tests
        run: cargo test --locked --manifest-path server/desktop/Cargo.toml -p traffic-lens-core
      - name: Frontend regression tests and NAS build
        run: |
          npm --prefix front-end test
          npm --prefix front-end run build
      - name: Build desktop installer
        run: npm --prefix front-end run desktop:build -- --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: Traffic-Lens-Windows-x64-${{ github.run_number }}
          path: server/desktop/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 30
